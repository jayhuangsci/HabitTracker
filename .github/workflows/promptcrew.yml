name: PromptCrew
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PromptCrew.slnx -c Release --warnaserror
      - run: dotnet test PromptCrew.slnx -c Release --no-build --logger trx --results-directory TestResults/PromptCrew
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/PromptCrew.Api --no-build --configuration Release
      - run: ./scripts/Test-PromptCrewAgent.ps1 -NoBuild
      - run: ./scripts/Publish-PromptCrew.ps1 -SelfContained
      - uses: actions/upload-artifact@v4
        with:
          name: PromptCrew-win-x64
          path: artifacts/PromptCrew-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PromptCrew-test-results
          path: TestResults/PromptCrew
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PromptCrew.Api.Tests -c Release
      - run: dotnet build src/PromptCrew.Tools -c Release --warnaserror
